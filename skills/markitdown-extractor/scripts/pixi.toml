[workspace]
name = "markitdown-extractor"
version = "0.1.0"
description = "Pixi environment for extracting text from PDFs via markitdown"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"
pip = "*"

[pypi-dependencies]
markitdown = { version = "*", extras = ["all"] }

[tasks]
extract = "python -m markitdown"
